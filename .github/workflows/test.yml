# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build & test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Build/install library
      run: |
        maturin build
        pip install target/wheels/*.whl
    - name: Test with pytest
      run: |
        pytest
    - name: Check type stubs against the library
      run: |
        python -m mypy.stubtest biscuit_auth --allowlist stubtest-allowlist.txt
    - name: Test documentation
      run: |
        pip install sphinx sphinx-rtd-theme
        make -C docs doctest
        make -C docs html
    - name: Test types
      uses: jpetrucciani/mypy-check@a33bdbb3d3b6133ec6b9a69178f65aa46751d50b # master
      with:
        requirements_file: "requirements-dev.txt"

  licenses:
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      DASH_VERSION: 1.1.0
      DASH_SHA256: ba4e84e1981f0e51f92a42ec8fc8b9668dabb08d1279afde46b8414e11752b06
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Cache the Eclipse Dash license tool
      id: dash-cache
      uses: actions/cache@v4
      with:
        path: dash-licenses.jar
        key: dash-licenses-${{ env.DASH_VERSION }}
    - name: Download the Eclipse Dash license tool
      if: steps.dash-cache.outputs.cache-hit != 'true'
      run: |
        curl -fsSL -o dash-licenses.jar \
          https://clementd-files.cellar-c2.services.clever-cloud.com/org.eclipse.dash.licenses-$DASH_VERSION.jar
    - name: Verify the Eclipse Dash license tool
      run: echo "$DASH_SHA256  dash-licenses.jar" | sha256sum -c
    - name: Check dependency licenses
      # the tool exits with the number of dependencies that are not approved
      shell: bash
      run: |
        cargo tree -e normal --prefix none --no-dedupe \
          | sort -u \
          | grep -v '^[[:space:]]*$' \
          | grep -v biscuit \
          | sed -E 's|([^ ]+) v([^ ]+).*|crate/cratesio/-/\1/\2|' \
          | java -jar dash-licenses.jar -summary DEPENDENCIES -
    - name: Upload the license summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependencies-licenses
        path: DEPENDENCIES
